name: Build Windows exe

on:
  push:
    branches: [main]
    paths:
      - "app.py"
      - "lyricvideo_core.py"
      - "fonts/**"
      - "requirements.txt"
      - "tests/**"
      - ".github/workflows/build-exe.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: python -m pip install -r requirements.txt

      - name: Test du moteur (tous les formats, avec et sans paroles)
        run: python tests/smoke_engine.py

      - name: Test de l'interface (3 vidéos en parallèle)
        run: python tests/smoke_gui.py

      - name: Construire l'exe
        run: >
          python -m PyInstaller --noconfirm --onefile --windowed
          --name LyricVideoMaker --add-data "fonts;fonts"
          --collect-all imageio_ffmpeg app.py

      - name: Tester l'exe (rendu en parallèle dans l'exe)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\LyricVideoMaker.exe -ArgumentList "--selftest", "$PWD\exe_test" -PassThru
          if (-not $p.WaitForExit(300000)) { $p.Kill(); throw "exe bloqué" }
          Get-ChildItem exe_test
          $r = Get-Content exe_test\selftest.txt -Raw
          Write-Output $r
          if (-not $r.StartsWith("OK")) { throw "selftest en échec" }

      - uses: actions/upload-artifact@v4
        with:
          name: LyricVideoMaker
          path: dist/LyricVideoMaker.exe

      - name: Publier la release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Lyric Video Maker v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: dist/LyricVideoMaker.exe
          generate_release_notes: true
