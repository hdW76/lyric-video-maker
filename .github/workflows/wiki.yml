name: Publier le wiki

on:
  push:
    branches: [main]
    paths: ["wiki/**", ".github/workflows/wiki.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wiki:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copier wiki/ vers le wiki GitHub
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          url="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git"
          if ! git clone --depth 1 "$url" wiki-remote; then
            echo "::error::Le wiki n'existe pas encore. Crée une première page dans l'onglet Wiki du dépôt, puis relance ce workflow."
            exit 1
          fi
          rsync -a --delete --exclude .git wiki/ wiki-remote/
          cd wiki-remote
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Wiki déjà à jour."
          else
            git commit -m "Wiki depuis ${GITHUB_SHA::7}"
            git push
          fi
